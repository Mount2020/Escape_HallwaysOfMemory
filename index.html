<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記憶的迴廊 - 選擇記憶</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/home.css">
    <link rel="icon" href="assets/favicon.png" type="image/png">
</head>
<body>
    <div id="transition-overlay"></div>
    <div class="background-container"></div>
    
    <div class="main-content">
        <h1 class="game-title">記憶的迴廊</h1>
        
        <div class="card-container">
            <!-- Game 1 -->
            <div class="game-card" onclick="transitionTo('game1.html')">
                <div class="card-thumbnail" style="background-image: url('assets/scenes/opening.png')">
                    <span class="badge badge-completed">已完成</span>
                </div>
                <div class="card-content">
                    <h2 class="card-title">《記憶的回聲》</h2>
                    <div class="card-difficulty">難度：★★☆☆☆</div>
                    <p class="card-desc">祖母遺留的舊宅中，藏著她當年放棄遠行、選擇留下的秘密。透過殘存的物品，重溫那段時光的記憶。</p>
                    <button class="action-btn">走進記憶</button>
                </div>
            </div>
            
            <!-- Game 2 -->
            <div class="game-card" onclick="transitionTo('game2.html')">
                <div class="card-thumbnail" style="background-image: url('assets/scenes/mansion_exterior.png'); background-position: center top;">
                    <span class="badge badge-new">新作</span>
                </div>
                <div class="card-content">
                    <h2 class="card-title">《沉默的繼承》</h2>
                    <div class="card-difficulty">難度：★★★★☆</div>
                    <p class="card-desc">一份突如其來的遺囑，將你引向荒野中的舊洋館。在鐘聲響起前，你必須找出這家族隱瞞的血脈真相。</p>
                    <button class="action-btn">走進記憶</button>
                </div>
            </div>
        </div>
        
        <div class="footer-text">「 選擇一段記憶，走進去。 」</div>
    </div>

    <button id="settings-btn" class="settings-btn" onclick="toggleSettings()" title="設定" style="position: absolute; top: 20px; right: 20px; background: transparent; color: var(--color-bg); font-size: 1.5rem; border: none; cursor: pointer; z-index: 1000;">⚙️</button>

    <div id="settings-modal" style="display: none; position: absolute; top: 60px; right: 20px; background: rgba(0,0,0,0.8); padding: 20px; border: 1px solid var(--color-accent); z-index: 1000; border-radius: 8px; width: 180px;">
        <h3 style="margin-top: 0; color: var(--color-accent); text-align: center; border-bottom: 1px solid var(--color-accent); padding-bottom: 10px;">設定</h3>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <span style="color: #fff;">背景音樂</span>
            <button id="music-toggle" class="action-btn" onclick="toggleMusic()" style="padding: 5px 10px;">🔇 關</button>
        </div>
        <div style="text-align: center;">
            <button class="action-btn" onclick="toggleSettings()">關閉</button>
        </div>
    </div>

    <script>
        let bgm = null;
        let musicPlaying = false;

        function initAudio() {
            bgm = new Audio('assets/audio/bgm_home.mp3');
            bgm.loop = true;
            
            const startAudio = () => {
                if (!musicPlaying) {
                    bgm.play().then(() => {
                        musicPlaying = true;
                        updateToggleBtn();
                    }).catch(e => console.log('Autoplay prevented', e));
                }
                document.body.removeEventListener('click', startAudio);
            };
            document.body.addEventListener('click', startAudio);
        }

        function updateToggleBtn() {
            const toggleBtn = document.getElementById('music-toggle');
            if(toggleBtn) toggleBtn.textContent = musicPlaying ? '🔊 開' : '🔇 關';
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            if (modal) {
                modal.style.display = modal.style.display === 'none' ? 'block' : 'none';
            }
        }

        function toggleMusic() {
            if (!bgm) initAudio();
            
            if (musicPlaying) {
                bgm.pause();
                musicPlaying = false;
            } else {
                bgm.play().catch(e => console.log('Play prevented', e));
                musicPlaying = true;
            }
            updateToggleBtn();
        }

        window.addEventListener('load', () => {
            initAudio();
            const overlay = document.getElementById('transition-overlay');
            setTimeout(() => {
                overlay.classList.add('fade-in');
            }, 50);
        });

        function transitionTo(url) {
            const overlay = document.getElementById('transition-overlay');
            overlay.classList.remove('fade-in');
            overlay.classList.add('fade-out');
            
            // Fade out audio
            if (bgm && !bgm.paused) {
                let vol = bgm.volume;
                let fade = setInterval(() => {
                    vol = Math.max(0, vol - 0.1);
                    bgm.volume = vol;
                    if (vol === 0) clearInterval(fade);
                }, 100);
            }

            setTimeout(() => {
                window.location.href = url;
            }, 1000);
        }
    </script>
</body>
</html>
